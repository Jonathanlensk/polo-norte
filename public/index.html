<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#061B3A">
    <title>Polo Norte Bebidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>

    <!-- SDK oficial do Mercado Pago para tokenização/Checkout Bricks -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <!-- Chave pública: pode ficar no frontend. A chave privada fica somente no .env do backend. -->
    <script>
        fetch("/api/config")
            .then(r => r.json())
            .then(config => {
                window.POLO_NORTE_PUBLIC_KEY = config.publicKey;
            })
            .catch(console.error);
    </script>

    <script src="script.js"></script>
</body>
</html>
